# =============================================================================
# Quant ETF Nginx 配置
# 安装路径: /etc/nginx/sites-available/quant-etf
# 启用方式: ln -s /etc/nginx/sites-available/quant-etf /etc/nginx/sites-enabled/
# =============================================================================

upstream quant_etf_api {
    # 后端 uvicorn 服务
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;

    # 修改为你的域名（如无域名可保留 _）
    server_name _;

    # 日志
    access_log /var/log/nginx/quant-etf-access.log;
    error_log /var/log/nginx/quant-etf-error.log;

    # 前端静态文件根目录
    root /var/www/quant-etf;
    index index.html;

    # 客户端上传大小限制
    client_max_body_size 10M;

    # =========================================================================
    # API 反向代理
    # =========================================================================
    location /api/ {
        proxy_pass http://quant_etf_api;

        # 代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;

        # 缓冲配置
        proxy_buffering off;
    }

    # =========================================================================
    # Swagger / ReDoc（透传至后端）
    # =========================================================================
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://quant_etf_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # 前端 SPA —— 所有非 /api 请求回退到 index.html
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================================================================
    # 静态资源缓存
    # =========================================================================
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # =========================================================================
    # 安全头
    # =========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
